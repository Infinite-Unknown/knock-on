modules:
  jira:issuePanel:
    - key: knock-on-panel
      resource: panel
      resolver:
        function: panel-resolver
      title: Knock-On
      icon: resource:panel;icon.svg

  rovo:agent:
    - key: knock-on-agent
      name: Knock-On
      description: Forecasts what breaks downstream when a Jira issue slips, and finds
        dependencies whose dates already contradict each other.
      prompt: resource:agent-prompt;prompt.md
      conversationStarters:
        - What breaks if this issue slips a week?
        - Which releases are at risk if this slips 3 days?
        - Find schedule conflicts in this project
      actions:
        - forecast-slip-impact
        - find-schedule-conflicts

  action:
    - key: forecast-slip-impact
      name: Forecast slip impact
      function: forecast-action
      actionVerb: GET
      description: Forecast which downstream Jira issues, due dates, releases and
        people are affected if a Jira issue slips by a number of business days.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue that may slip, for example CHK-12.
        slipDays:
          title: Slip in business days
          type: integer
          required: true
          description: How many business days (Monday to Friday) the issue may slip. 5 is
            one week.
    - key: find-schedule-conflicts
      name: Find schedule conflicts
      function: conflicts-action
      actionVerb: GET
      description: Scan a Jira project for dependencies whose dates already conflict -
        blockers due too late for the work they block, or children due after
        their parent.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key to scan, for example CHK.

  rovo:mcp:
    - key: knock-on-mcp
      name: Knock-On
      tools:
        - forecast-slip-impact
        - find-schedule-conflicts

  function:
    - key: panel-resolver
      handler: index.handler
    - key: forecast-action
      handler: index.forecastAction
    - key: conflicts-action
      handler: index.conflictsAction

resources:
  - key: panel
    path: static/panel/build
  - key: agent-prompt
    path: agent

permissions:
  scopes:
    - read:jira-work
    - write:jira-work

app:
  id: ari:cloud:ecosystem::app/a6f42b84-8870-4794-bcc4-f31a62764990
  runtime:
    name: nodejs22.x
